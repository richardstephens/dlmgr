[package]
name = "dlmgr"
description = "A multi-threaded file downloader."

version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
atomic-write-file = "0.3.0"
hex = "0.4.3"
reqwest = { version = "0.13.2", default-features = false }
sha2 = "0.10.9"
thiserror = "2.0.17"
tokio = { version = "1.47.1", features = ["net", "sync"] }
tracing = "0.1.41"
url = "2.5.7"

[dev-dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
range-server = { path = "../range-server" }
tempfile = "3.27.0"
uuid = { version = "1.23.4", features = ["v4", "fast-rng"] }
