[package]
name = "dlmgr-cli"
description = "CLI tool for working with and testing the downlaod manager in the dlmgr crate"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[dependencies]
dlmgr.workspace = true

anyhow = "1.0.100"
clap = { version = "4.5.48", features = ["derive"] }
tokio = { version = "1.47.1", features = ["rt-multi-thread", "sync", "tracing", "macros"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
url = "2.5.7"
reqwest = { version = "0.13.2", features = ["http2"] }
indicatif = "0.18.2"
hex = "0.4.3"
