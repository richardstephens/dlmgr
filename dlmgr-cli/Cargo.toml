[package]
name = "dlmgr-cli"
description = "CLI tool for working with and testing the downlaod manager in the dlmgr crate"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[dependencies]
dlmgr.workspace = true

anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "tracing", "macros"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = "2.5.8"
reqwest = { version = "0.13", features = ["http2"] }
indicatif = "0.18.6"
hex = "0.4.3"
